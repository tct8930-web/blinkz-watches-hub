<!DOCTYPE html>
<html>

<head>
    <title>Blinkz Watches Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 30px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .product {
            background: white;
            padding: 20px;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .product h2 {
            font-size: 22px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>Blinkz Watches Hub</h1>

    <p>Quality watches for every style.</p>

    <h2>Our Watches</h2>

    <div class="products">

        <div class="product">
            <h2>G-Shock</h2>
            <p class="price">₦50,000</p>
            <a href="https://wa.me/2347066159449" class="button">Order on WhatsApp</a>
        </div>

        <div class="product">
            <h2>TISSOT RUBBER STRAP</h2>
            <p class="price">₦80,000</p>
            <a href="https://wa.me/2347066159449" class="button">Order on WhatsApp</a>
        </div>

        <div class="product">
            <h2>Cadier</h2>
            <p class="price">₦150,000</p>
            <a href="https://wa.me/2347066159449" class="button">Order on WhatsApp</a>
        </div>

        <div class="product">
            <h2>FRANCK MULLEN</h2>
            <p class="price">₦300,000</p>
            <a href="https://wa.me/2347066159449" class="button">Order on WhatsApp</a>
        </div>

    </div>

</body>

</html>
